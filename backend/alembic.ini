# Alembic 설정 골격. DB 접속 URL은 여기에 쓰지 않는다(Secret 방지).
# migrations/env.py가 POSTGRES_* 환경변수에서 sqlalchemy.engine.URL.create로 만든다.
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# 모든 revision은 downgrade()를 구현한다(D5). 왕복 테스트: upgrade head -> downgrade base -> upgrade head.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
