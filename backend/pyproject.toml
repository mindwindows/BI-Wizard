# 패키징 설정이 아니라 도구(ruff, pytest) 설정만 둔다.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 실행 시간이 긴 시험(차분 전수 행렬 등). 기본 전체 실행에 포함하고, 빠른 확인은 -m 'not slow'로 뺀다.",
]
