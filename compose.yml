# BI-Wizard 로컬 실행 기준(Single Entry). 시작: docker compose up -d --build / 종료: docker compose down (볼륨 삭제 옵션 금지)
#
# 서비스 순서:  postgres(healthy) -> db-bootstrap(성공 완료) -> migrate(성공 완료) -> backend -> frontend
#               db-bootstrap + migrate -> superset-init(성공 완료) -> superset
# DB 계정(03b 3-2): POSTGRES_USER/POSTGRES_PASSWORD는 이미지 슈퍼유저 전용이다(postgres 이미지, healthcheck,
#   db-bootstrap만 쓴다. 운영 가이드의 POSTGRES_USER=앱 계정 의미와 다른 의도적 차이).
#   migrate는 bi_owner(POSTGRES_OWNER_PASSWORD), backend는 bi_app(POSTGRES_APP_PASSWORD)로 접속한다(계정 이름은 코드 상수).
# 브라우저는 frontend nginx(FRONTEND_PORT)만 접속한다. 이 nginx가 로컬에서 메인 플랫폼 프록시 역할을 재현한다:
#   ${APP_BASE_PATH}/ -> 포털 정적 파일, ${APP_BASE_PATH}/api/ -> backend, ${SUPERSET_APP_ROOT}/ -> superset
# 모든 서비스에 mem_limit을 고정한다(docs/decisions/03a-deploy-environment.md, 합계 8GB 안, 숫자는 추정이며 docker stats로 실측한다).
# Redis/Valkey/Celery는 두지 않는다. 컨테이너에는 필요한 변수만 environment로 전달한다(전체 .env를 넘기지 않는다).

name: bi-wizard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-build: &backend-build
  context: ./backend

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    mem_limit: 1536m
    command: ["postgres", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      PGPORT: ${POSTGRES_PORT:?POSTGRES_PORT를 .env에 설정하세요}
      TZ: ${TZ:?TZ를 .env에 설정하세요}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  # DB 계정(bi_owner, bi_app, bi_readonly, superset_meta), 빈 schema bi_data, Superset 메타 DB를 매 기동
  # 멱등으로 만든다(initdb.d 미사용). 이미지 슈퍼유저로 접속하는 유일한 서비스다.
  db-bootstrap:
    image: postgres:16.10-bookworm
    restart: "no"
    mem_limit: 128m
    user: postgres
    entrypoint: ["bash", "/bootstrap/run.sh"]
    environment:
      PGHOST: ${POSTGRES_HOST:?POSTGRES_HOST를 .env에 설정하세요}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?POSTGRES_READONLY_PASSWORD를 .env에 설정하세요}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD를 .env에 설정하세요}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD를 .env에 설정하세요}
    volumes:
      - ./backend/bootstrap:/bootstrap:ro
    # postgres 이미지는 데이터 디렉터리를 VOLUME으로 선언한다. 클라이언트로만 쓰므로 익명 볼륨이 쌓이지 않게 비운 tmpfs로 덮는다.
    tmpfs:
      - /var/lib/postgresql/data:size=1m
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # backend 이미지를 재사용하는 일회성 마이그레이션(Alembic). 앱 코드는 시작 때 마이그레이션을 실행하지 않는다.
  # 접속 계정은 bi_owner(코드 상수)이고 비밀번호만 받는다. 슈퍼유저 변수는 넘기지 않는다.
  migrate:
    build: *backend-build
    image: bi-wizard-backend:local
    restart: "no"
    mem_limit: 512m
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD를 .env에 설정하세요}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    logging: *default-logging

  # 접속 계정은 bi_app(코드 상수)이고 비밀번호만 받는다. 슈퍼유저 변수와 소유자 비밀번호는 넘기지 않는다.
  backend:
    build: *backend-build
    image: bi-wizard-backend:local
    restart: unless-stopped
    mem_limit: 1g
    environment:
      APP_NAME: ${APP_NAME:?APP_NAME을 .env에 설정하세요}
      APP_ENV: ${APP_ENV:?APP_ENV를 .env에 설정하세요}
      APP_DEBUG: ${APP_DEBUG:?APP_DEBUG를 .env에 설정하세요}
      APP_BASE_PATH: ${APP_BASE_PATH?APP_BASE_PATH를 .env에 설정하세요(루트 배포는 빈 값)}
      APP_PROXY_STRIP_PREFIX: ${APP_PROXY_STRIP_PREFIX:?APP_PROXY_STRIP_PREFIX를 .env에 설정하세요}
      BACKEND_HOST: ${BACKEND_HOST:?BACKEND_HOST를 .env에 설정하세요}
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT를 .env에 설정하세요}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
      # Superset 서비스·발급 전용 계정(EW-3, 사용은 FU-1e). Superset 내부 주소는 코드 상수(http://superset:8088)이고
      # 하위 경로만 SUPERSET_APP_ROOT로 받는다(AP-12). 설정 누락은 compose 단계에서 막고, backend는 값이 없어도 시작한다
      # (Superset 불가가 포털을 멈추지 않는다: 08 §2-1. 필요한 쪽이 사용 시점에 실패한다).
      SUPERSET_APP_ROOT: ${SUPERSET_APP_ROOT:?SUPERSET_APP_ROOT를 .env에 설정하세요}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:?SUPERSET_SERVICE_USER를 .env에 설정하세요}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?SUPERSET_SERVICE_PASSWORD를 .env에 설정하세요}
      SUPERSET_GUEST_ISSUER_USER: ${SUPERSET_GUEST_ISSUER_USER:?SUPERSET_GUEST_ISSUER_USER를 .env에 설정하세요}
      SUPERSET_GUEST_ISSUER_PASSWORD: ${SUPERSET_GUEST_ISSUER_PASSWORD:?SUPERSET_GUEST_ISSUER_PASSWORD를 .env에 설정하세요}
      # 인증 스텁 스위치(기본 false). true는 APP_ENV가 local 또는 test일 때만 시작을 허용한다.
      AUTH_STUB_ENABLED: ${AUTH_STUB_ENABLED:?AUTH_STUB_ENABLED를 .env에 설정하세요}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL을 .env에 설정하세요}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  # 정적 빌드를 nginx로 서빙하고, 로컬에서 메인 플랫폼 프록시 역할(포털 API, Superset)을 한다.
  # 전체 .env를 넘기지 않는다: 공개 설정과 backend 포트만 전달한다.
  frontend:
    build:
      context: ./frontend
    image: bi-wizard-frontend:local
    restart: unless-stopped
    mem_limit: 256m
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH}
      SUPERSET_APP_ROOT: ${SUPERSET_APP_ROOT:?SUPERSET_APP_ROOT를 .env에 설정하세요}
      APP_PROXY_STRIP_PREFIX: ${APP_PROXY_STRIP_PREFIX}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${FRONTEND_HOST:?FRONTEND_HOST를 .env에 설정하세요}:${FRONTEND_PORT:?FRONTEND_PORT를 .env에 설정하세요}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging

  # Superset 초기화(일회성, 멱등): db upgrade -> 관리자 -> init -> 업무 데이터 연결(bi_readonly) 등록
  #   -> schema 권한 동기화 -> 역할 4개 -> 서비스·발급 전용 계정 2개
  superset-init:
    build:
      context: ./superset
    image: bi-wizard-superset:6.1.0
    restart: "no"
    mem_limit: 1g
    entrypoint: ["bash", "/app/bi-wizard/init.sh"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY를 .env에 설정하세요}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:?GUEST_TOKEN_JWT_SECRET를 .env에 설정하세요}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_APP_ROOT: ${SUPERSET_APP_ROOT}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER를 .env에 설정하세요}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD를 .env에 설정하세요}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:?SUPERSET_SERVICE_USER를 .env에 설정하세요}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?SUPERSET_SERVICE_PASSWORD를 .env에 설정하세요}
      SUPERSET_GUEST_ISSUER_USER: ${SUPERSET_GUEST_ISSUER_USER:?SUPERSET_GUEST_ISSUER_USER를 .env에 설정하세요}
      SUPERSET_GUEST_ISSUER_PASSWORD: ${SUPERSET_GUEST_ISSUER_PASSWORD:?SUPERSET_GUEST_ISSUER_PASSWORD를 .env에 설정하세요}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      # bi_readonly의 bi_data USAGE는 마이그레이션 0002가 준다. 빈 볼륨 새 설치에서 schema 권한 동기화(schema_access 생성)가
      # 이 권한보다 먼저 실행되는 순서 경쟁을 막으려고 migrate 완료를 기다린다. migrate는 db-bootstrap에만 의존하므로
      # 순환 의존이 없다(superset-init -> migrate -> db-bootstrap -> postgres).
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  superset:
    build:
      context: ./superset
    image: bi-wizard-superset:6.1.0
    restart: unless-stopped
    mem_limit: 2g
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_APP_ROOT: ${SUPERSET_APP_ROOT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      TZ: ${TZ}
      # gunicorn 워커 1개. 주기적 재시작(WORKER_MAX_REQUESTS)은 쓰지 않는다: 워커가 1개라 재시작 순간
      # 요청 1건이 502가 되고 다음 요청이 지연된다(QA 재현). 메모리 보호는 mem_limit + restart 정책에 맡긴다.
      SERVER_WORKER_AMOUNT: "1"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS "http://127.0.0.1:8088$${SUPERSET_APP_ROOT}/health" > /dev/null']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

  # 마이그레이션 왕복 테스트용 빈 DB(profile test). 데이터는 tmpfs(256MB 제한)라 컨테이너를 지우면 사라진다.
  # 호스트에 포트를 게시하지 않는다. 사용법은 skills/local-environment/SKILL.md.
  postgres-test:
    profiles: ["test"]
    image: postgres:16.10-bookworm
    restart: "no"
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "fsync=off"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      TZ: ${TZ}
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

volumes:
  postgres_data:
